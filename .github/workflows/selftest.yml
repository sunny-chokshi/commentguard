# Self-test: runs this repository's own action on the demo files.
name: selftest
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet . pytest
      - run: python -m pytest -q

  action-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: cg
        uses: ./
        with:
          paths: demo
          base-ref: ""
          fail-on: never
      - name: Expect findings on the demo files
        env:
          SARIF: ${{ steps.cg.outputs.sarif-file }}
        run: |
          n=$(python -c "import json,sys; print(sum(len(r.get('results',[])) for r in json.load(open(sys.argv[1]))['runs']))" "$SARIF")
          echo "SARIF results: $n"
          test "$n" -gt 0
